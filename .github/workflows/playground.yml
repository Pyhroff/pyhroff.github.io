name: Playground tests

on:
  push:
    branches: ["main"]
  pull_request:
    paths: ["playground/**", ".github/workflows/playground.yml"]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # Match the browser runtime: Pyodide 0.27.x (index.html) bundles Python 3.12.
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: python -m pytest playground -q
